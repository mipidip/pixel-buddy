<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Buddy</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="app">

    <div class="container">

      <div class="pixel-face">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
      </div>

      <div class="bubble" id="bubble">
        Merhaba! Bana bir şey sormak ister misin?
      </div>

      <button class="mic-btn" onclick="startListening()">
        🎤
      </button>

      <div class="text-input-container">
        <input type="text" id="textInput" placeholder="Buraya yazabilirsin ✏️" />
        <button id="sendBtn">Gönder </button>
      </div>

    </div>

    <div class="chat-box" id="chatBox">
      <h3>Sohbet Geçmişi</h3>
      <div id="messages"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
